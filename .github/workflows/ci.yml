name: CI

on:
  pull_request:
    branches:
      - audit/studio-v4
  push:
    branches:
      - audit/studio-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-secret-not-used-outside-github-actions"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      MULTILINGUAL_PUBLICATION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build the application
        run: npm run build
